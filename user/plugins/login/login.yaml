enabled: true
built_in_css: true

# --- KLUCZOWE OPCJE DLA DZIAŁANIA DOSTĘPU ---
redirect_to_login: true            # wymusza przekierowanie na /login
redirect_after_login: '/'          # po zalogowaniu
redirect_after_logout: '/'         # po wylogowaniu

route: '/login'                    # strona logowania

dynamic_page_visibility: true      # access ukrywa strony i menu
parent_acl: true                   # access z frontmattera DZIAŁA
protect_protected_page_media: true # blokuje dostęp do mediów chronionych stron

# --- GLOBALNE WYMAGANIE LOGOWANIA DLA CAŁEJ WITRYNY ---
access:
  site:
    login: true

# --- OPCJE DODATKOWE ---
session_user_sync: false
site_host:
require_trusted_host: false

route_after_login: '/'
route_after_logout: '/'
route_activate: '/activate_user'
route_forgot: '/forgot_password'
route_reset: '/reset_password'
route_magic: '/magic_login'
route_magic_login: '/magic_link'
route_profile: '/user_profile'
route_register: '/user_register'
route_unauthorized: '/user_unauthorized'

twofa_enabled: false

rememberme:
  enabled: true
  timeout: 604800
  name: grav-rememberme

max_pw_resets_count: 2
max_pw_resets_interval: 60
max_login_count: 5
max_login_interval: 10
max_token_attempts_count: 5
max_token_attempts_interval: 60
ipv6_subnet_size: 64

magic_link:
  enabled: false
  ttl: 10
  redirect_after_request: ''
  max_requests_count: 5
  max_requests_interval: 15

user_registration:
  enabled: false
  max_attempts_count: 10
  max_attempts_interval: 60

  fields:
    - 'username'
    - 'password'
    - 'email'
    - 'fullname'
    - 'title'
    - 'level'
    - 'twofa_enabled'

  default_values:
    level: Newbie

  access:
    site:
      login: true

  redirect_after_registration: ''
  redirect_after_activation: ''

  options:
    validate_password1_and_password2: true
    set_user_disabled: false
    login_after_registration: false
    send_activation_email: false
    manually_enable: false
    send_notification_email: false
    send_welcome_email: false
