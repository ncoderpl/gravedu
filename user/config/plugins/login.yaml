enabled: true
built_in_css: true

redirect_to_login: true
redirect_after_login: true
redirect_after_logout: true

route: /login
route_after_login: /
route_after_logout: /

dynamic_page_visibility: true
parent_acl: true
protect_protected_page_media: true

session_user_sync: false
require_trusted_host: false

routes:
  activate: /activate_user
  forgot: /forgot_password
  reset: /reset_password
  magic: /magic_login
  magic_login: /magic_link
  profile: /user_profile
  register: /user_register
  unauthorized: /user_unauthorized

twofa_enabled: false

remember_me:
  enabled: true
  timeout: 604800
  name: grav-rememberme

magic_link:
  enabled: false
  ttl: 10
  redirect_after_request: /
  max_requests_count: 5
  max_requests_interval: 15

user_registration:
  enabled: false
  max_attempts_count: 10
  max_attempts_interval: 60

  fields:
    - username
    - password
    - email
    - fullname
    - title
    - level
    - twofa_enabled

  default_values:
    level: Newbie

  access:
    site:
      login: true

  redirect_after_registration: /
  redirect_after_activation: /

  options:
    validate_password1_and_password2: true
    set_user_disabled: false
    login_after_registration: false
    send_activation_email: false
    manually_enable: false
    send_notification_email: false
    send_welcome_email: false